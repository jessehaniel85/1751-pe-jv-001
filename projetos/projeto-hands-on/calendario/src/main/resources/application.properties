# Aula 5: serviço de calendário da Agenda de Atendimento. Porta 8081: a agenda fica na 8080.
quarkus.http.port=8081
# Nos testes, porta aleatória: o teste não colide com o calendario aberto em quarkus:dev.
quarkus.http.test-port=0
# Atraso artificial de cada resposta, em milissegundos, para simular "o calendário demora no pior dia".
# Em aula: com o quarkus:dev no ar, troque para 2000 e salve; a agenda passa a responder 503 depois do timeout.
calendario.atraso-ms=0
