quarkus.smallrye-openapi.info-title=API de Agenda de Atendimento
quarkus.smallrye-openapi.info-version=1.0.0
# Aula 3: H2 em memória. Sem Docker na rede, os Dev Services (banco em contêiner) ficam desligados.
quarkus.devservices.enabled=false
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:agenda;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create
# Dados de exemplo: sem quarkus.hibernate-orm.sql-load-script, o Quarkus carrega o import.sql só em dev e test;
# no jar (perfil prod), não carrega nada.
# Perfil %dev: banco em arquivo (pasta data/) e update, que mantém tabelas e dados entre um reinício e outro.
# Com drop-and-create, o arquivo seria apagado e recriado a cada subida. Testes e jar seguem em memória.
%dev.quarkus.datasource.jdbc.url=jdbc:h2:file:./data/agenda
%dev.quarkus.hibernate-orm.database.generation=update
# Perfil %dev: mostra o SQL só no modo de desenvolvimento.
%dev.quarkus.hibernate-orm.log.sql=true

# Aula 4: configuração do domínio, lida por AgendaConfig (@ConfigMapping, prefixo agenda).
# Escolha didática da Aula 1 (expediente das 10h às 16h, atendimento de 30 min), agora fora do código.
# Sobrescreve sem recompilar: AGENDA_LIMITE_POR_CLIENTE=1 ou -Dagenda.limite-por-cliente=1.
agenda.expediente.abertura=10:00
agenda.expediente.encerramento=16:00
agenda.expediente.duracao-minutos=30
agenda.limite-por-cliente=3

quarkus.rest-client.calendario.url=http://localhost:28081

# Complemento JWT: sai o Basic da Aula 7 (quarkus.http.auth.basic=true) e entra o Bearer.
# Quem confere o token: chave pública e emissor esperado.
mp.jwt.verify.publickey.location=chaves/publicKey.pem
mp.jwt.verify.issuer=agenda-atendimento
# Quem emite o token (POST /login): chave privada, emissor e validade em segundos (300 é o padrão da biblioteca).
# A chave privada fica fora do repositório (pasta chaves/ no .gitignore). Em produção, os dois caminhos vêm por
# variável de ambiente: MP_JWT_VERIFY_PUBLICKEY_LOCATION e SMALLRYE_JWT_SIGN_KEY_LOCATION.
smallrye.jwt.sign.key.location=chaves/privateKey.pem
smallrye.jwt.new-token.issuer=${mp.jwt.verify.issuer}
smallrye.jwt.new-token.lifespan=300
# Declara o esquema Bearer no documento OpenAPI; a Swagger UI ganha o botão Authorize para colar o token.
quarkus.smallrye-openapi.security-scheme=jwt

# Aula 8: autorização por configuração para os caminhos que não são recursos JAX-RS (/q/*).
# Health aberto (o orquestrador não tem usuário); métricas só para gerente; documentação para quem tem login.
quarkus.http.auth.permission.health.paths=/q/health,/q/health/*
quarkus.http.auth.permission.health.policy=permit
quarkus.http.auth.policy.somente-gerente.roles-allowed=gerente
quarkus.http.auth.permission.metricas.paths=/q/metrics,/q/metrics/*
quarkus.http.auth.permission.metricas.policy=somente-gerente
quarkus.http.auth.permission.documentacao.paths=/q/openapi,/q/openapi/*,/q/swagger-ui,/q/swagger-ui/*
quarkus.http.auth.permission.documentacao.policy=authenticated
# Complemento JWT: documentação aberta só em dev (o navegador não manda Bearer ao abrir a página).
%dev.quarkus.http.auth.permission.documentacao.policy=permit

