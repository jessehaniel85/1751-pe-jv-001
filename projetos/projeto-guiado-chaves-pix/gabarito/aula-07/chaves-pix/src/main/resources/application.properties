# Aula 2: título da documentação OpenAPI. A Swagger UI fica em /q/swagger-ui (dev e test).
quarkus.smallrye-openapi.info-title=API de Chaves PIX
quarkus.smallrye-openapi.info-version=1.0.0

# Aula 3: H2 em memória. Sem Docker na rede, os Dev Services (banco em contêiner) ficam desligados.
quarkus.devservices.enabled=false
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:chaves;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create
# Dados de exemplo: sem quarkus.hibernate-orm.sql-load-script, o Quarkus carrega o import.sql só em dev e test;
# no jar (perfil prod), não carrega nada.

# Aula 4: configuração do domínio, lida por PixConfig (@ConfigMapping).
# Regra do DICT para pessoa física: até 5 chaves por conta.
# Pode ser sobrescrita sem recompilar: variável PIX_CHAVES_LIMITE_POR_CONTA ou -Dpix.chaves.limite-por-conta.
pix.chaves.limite-por-conta=5

# Aula 4: perfis. Sem prefixo = vale em todos; %dev = quarkus:dev; %test = @QuarkusTest; %prod = jar empacotado.
%dev.quarkus.hibernate-orm.log.sql=true
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:chaves-test;DB_CLOSE_DELAY=-1

# Aula 5: serviço de contas (módulo contas, porta 8081).
quarkus.rest-client.contas.url=http://localhost:8081
# Nos testes, porta aleatória: assim o teste não colide com o contas aberto em quarkus:dev na 8081.
quarkus.http.test-port=0

# Aula 5: Fault Tolerance por configuração (<classe>/<método>/<anotação>/<parâmetro>).
# Valores didáticos, iguais aos das anotações: em produção, saem de medição (latência p99, taxa de erro).
tech.ada.pix.chaves.ContasGateway/confirmarConta/Timeout/value=500
tech.ada.pix.chaves.ContasGateway/confirmarConta/Retry/maxRetries=2
tech.ada.pix.chaves.ContasGateway/confirmarConta/CircuitBreaker/requestVolumeThreshold=4

# Aula 6: mensagens de validação em português (ValidationMessages.properties).
quarkus.default-locale=pt-BR

# Aula 7: autenticação HTTP Basic, com usuários na tabela Usuario (quarkus-security-jpa, senha em BCrypt).
quarkus.http.auth.basic=true
